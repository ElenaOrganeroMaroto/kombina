name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    # Base de datos MongoDB temporal solo para los tests (no usa Atlas ni secretos)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/kombina_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run jest
        run: npx jest --forceExit