<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kombina - Crear Outfit</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <!-- Cabecera de marca con línea divisoria fina -->
        <div style="padding-bottom: 0.8rem; border-bottom: 1px solid #e7e2d8;">
            <h2 class="brand-header" style="margin: 0; padding-top: 1.2rem;">kombina</h2>
        </div>

        <!-- Cabecera de la sección (coherente con las demás vistas) -->
        <div style="padding: 1.2rem 1.5rem 0.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-weight: 600; font-size: 1.4rem; margin: 0; color: #2c2c2c;">Crear outfit</h2>
        </div>

        <!-- Contenido principal -->
        <div class="content-scroll" style="padding: 0.5rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 20px;">

            <!-- Añadir prendas (compacto). Solo se ve mientras no hay ninguna prenda elegida -->
            <div id="addPrendasBox" onclick="goToWardrobeSelector()" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0; border: 2px dashed #dcd6ce; border-radius: 18px; padding: 24px 20px; background: #ffffff; cursor: pointer;">
                <span style="width: 48px; height: 48px; border-radius: 50%; background: #f3efe8; color: #555; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; line-height: 1; flex-shrink: 0;">+</span>
                <div style="min-width: 0;">
                    <strong style="display: block; font-size: 1.05rem; color: #333;">Añadir prendas</strong>
                    <span style="display: block; font-size: 0.8rem; color: #888; margin-top: 3px;">Selecciona las prendas de tu armario</span>
                </div>
            </div>

            <!-- Outfit en construcción: vista previa en vivo + prendas elegidas (oculto si no hay prendas) -->
            <div id="outfitBuilder" style="display: none; flex-shrink: 0;">
                <span style="font-size: 0.9rem; color: #444; font-weight: 600; display: block; margin-bottom: 12px;">Mi outfit</span>
                <div id="selectedOutfitItems"></div>
                <div id="selectedOutfitChips" style="display: flex; gap: 10px; overflow-x: auto; padding: 14px 6px 4px 6px;"></div>
                <p id="outfitHint" style="margin: 10px 2px 0 2px; font-size: 0.78rem; color: #8a857c; line-height: 1.4;">Toca la ✕ para quitar una prenda o el + para añadir más.</p>
            </div>

            <!-- Botón de acción principal (solo aparece cuando hay prendas) -->
            <button id="generateBtn" onclick="generateAndSaveOutfit()" class="btn-primary" style="display: none; flex-shrink: 0;">Generar outfit</button>

            <!-- Outfits guardados (se oculta mientras se crea un outfit) -->
            <div id="savedSection" style="flex-shrink: 0;">
                <h3 style="font-size: 1rem; color: #333; margin: 0 0 12px 0; font-weight: 600;">Último outfit</h3>
                <div id="savedOutfitsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
        </div>

        <!-- Navegación inferior fija -->
        <div id="bottom-nav-container"></div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/create-outfit.js"></script>
</body>
</html>
